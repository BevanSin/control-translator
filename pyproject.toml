[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "control-translator"
version = "0.1.0"
description = "Agentic translation of published security standards into deployable cloud compliance controls"
requires-python = ">=3.10"
dependencies = []

# Optional, per-stage dependencies. The core skeleton runs on the standard library;
# these are only needed once the real (non-stub) plugins are wired up.
[project.optional-dependencies]
yaml           = ["pyyaml>=6"]
azure          = ["azure-identity>=1.16", "azure-mgmt-resource>=23"]
agentic        = ["anthropic>=0.39", "numpy>=1.26"]
openai          = ["openai>=1.50", "azure-identity>=1.16", "numpy>=1.26"]
azure-inference = ["azure-ai-inference>=1.0", "azure-identity>=1.16"]
review          = ["openpyxl>=3.1"]
mcp             = ["mcp>=1.27,<2"]
api             = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2", "httpx>=0.27", "openpyxl>=3.1"]
dev             = ["build>=1.2", "pytest>=8", "openpyxl>=3.1", "ruff>=0.12", "httpx>=0.27"]

[project.scripts]
ct = "control_translator.cli:main"
ct-mcp = "control_translator.mcp_server:main"
ct-api = "control_translator.api.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

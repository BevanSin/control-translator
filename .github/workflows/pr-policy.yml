name: PR Policy

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - labeled
      - unlabeled
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  policy:
    name: Documentation and security policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test policy enforcement
        shell: bash
        run: bash .github/scripts/test-enforce-pr-policy.sh

      - name: Enforce pull request policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: bash .github/scripts/enforce-pr-policy.sh
